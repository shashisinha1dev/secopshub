server.port=${SERVER_PORT:8081}
spring.application.name=incident-service
spring.datasource.url=jdbc:h2:mem:secopsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:secops}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:dev-password-change-me}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Shared local-development JWT secret. Override JWT_SECRET_BASE64 outside local demos.
security.jwt.secret-base64=${JWT_SECRET_BASE64:c2Vjb3BzaHViLWxvY2FsLWRldi1qd3Qtc2VjcmV0LWtleS0zMi1ieXRlcw==}
