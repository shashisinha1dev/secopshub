
name: SecOpsHub Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Build and test Spring Boot microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: secopshub-microservices/**/pom.xml

      - name: Build and test backend
        working-directory: secopshub-microservices
        run: mvn --batch-mode --no-transfer-progress clean verify
